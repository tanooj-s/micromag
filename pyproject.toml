[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "micromag"
version = "0.0.1"
requires-python = ">=3.11"  # tomllib (D27)
license = "GPL-3.0-or-later"  # D39
license-files = ["LICENSE"]
dependencies = ["numpy", "h5py"]

[project.scripts]
micromag = "micromag.run:main"

[dependency-groups]
dev = [
    "mpmath>=1.4.1",
    "pytest",
]
docs = ["matplotlib"]  # docs/make_figures.py only: `uv run --group docs python docs/make_figures.py` (D39)

[tool.pytest.ini_options]
markers = ["slow: long physics runs (e.g. µMAG SP4); run with `pytest -m slow`"]
addopts = "-m 'not slow'"

[tool.scikit-build]
wheel.packages = ["python/micromag"]
build-dir = "build/{wheel_tag}"  # keep the CMake build tree between runs so rebuilds are incremental
cmake.version = ">=3.18"         # the cluster module is 3.17; scikit-build-core fetches a newer cmake from PyPI

[tool.uv]
# `uv run` rebuilds the extension when any of these change
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "src/**" },
  { env = "SKBUILD_CMAKE_DEFINE" },
]
